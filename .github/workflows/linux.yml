name: CI - Linux (APT)

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitlab-ci.yml
      - .gitignore
      - '*.md'
      - CITATION.*
      - LICENSE
      - colcon.pkg
      - .pre-commit-config.yaml
      - CHANGELOG.md
      - development/*.md
  pull_request:
    paths-ignore:
      - .gitlab-ci.yml
      - .gitignore
      - '*.md'
      - CITATION.*
      - LICENSE
      - colcon.pkg
      - .pre-commit-config.yaml
      - CHANGELOG.md
      - development/*.md
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: CI - Ubuntu ${{ matrix.ubuntu_version }} - ${{ matrix.build_type }} (APT)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.ubuntu_version }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ["22.04", "24.04"]
        build_type: [Release, Debug]
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies via APT
        run: |
          apt-get update
          apt-get install -y \
            git \
            g++ \
            cmake \
            ninja-build \
            ccache \
            libeigen3-dev \
            libsuitesparse-dev \
            python3-dev \
            python3-numpy \
            python3-scipy \
            python3-pytest

      - uses: actions/checkout@v7

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.build_type }}-

      - name: Clear ccache stats
        run: ccache --show-stats --zero-stats --verbose

      - name: CMake Configure
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DBUILD_WITH_CHOLMOD_SUPPORT=ON

      - name: CMake Build
        run: cmake --build build --verbose --parallel 2

      - name: Show ccache stats
        run: ccache --show-stats --verbose

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: CMake Install
        run: cmake --install build --prefix install

  check:
    if: always()
    name: check-linux

    needs:
      - ubuntu

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
